name: forward-decrypt release

# Builds tools/thunderbird-forward-decrypt into forward-decrypt.xpi and attaches it to a
# GitHub release, on push of a tools-forward-decrypt-vX.Y.Z tag. See
# tools/thunderbird-forward-decrypt/README.md for how this is used (Enterprise Policy
# install_url / update_url).
on:
  push:
    tags: ['tools-forward-decrypt-v*']

jobs:
  release:
    name: Build and release forward-decrypt.xpi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/thunderbird-forward-decrypt/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: tools/thunderbird-forward-decrypt

      - name: Test add-on and Experiment lifecycle
        run: npm test -- --runInBand
        working-directory: tools/thunderbird-forward-decrypt

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check api/ForwardIntercept/implementation.js
        working-directory: tools/thunderbird-forward-decrypt

      - name: Build xpi
        run: ./build.sh
        working-directory: tools/thunderbird-forward-decrypt

      - name: Verify xpi
        run: unzip -t dist/forward-decrypt.xpi
        working-directory: tools/thunderbird-forward-decrypt

      - name: Attach xpi to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: tools/thunderbird-forward-decrypt/dist/forward-decrypt.xpi
