name: Windows build

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # bindgen needs libclang; the windows-latest image ships LLVM here.
  LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

jobs:
  build:
    name: Build DLL (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release DLL
        run: cargo build --release

      - name: Provision regression test certificates
        shell: pwsh
        run: ./scripts/provision-smime-test-certs.ps1

      - name: Run tests (host target)
        run: cargo test --all-targets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osclientcerts.dll
          path: target/release/osclientcerts.dll
          if-no-files-found: error

  release:
    name: Release (tag build)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DLL built by the build job
        uses: actions/download-artifact@v4
        with:
          name: osclientcerts.dll

      - name: Attach DLL to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: osclientcerts.dll
