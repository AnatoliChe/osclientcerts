[package]
name = "osclientcerts"
version = "0.3.8"
authors = ["Dana Keeler <dkeeler@mozilla.com>", "AnatoliChe <AnatoliChe@gmail.com>"]
edition = "2024"
description = "PKCS#11 module exposing OS certificate stores as PKCS#11 tokens; standalone Windows x64 DLL fork of Mozilla's osclientcerts adapted for Thunderbird S/MIME with non-exportable CNG keys"
repository = "https://github.com/AnatoliChe/osclientcerts"
license = "MPL-2.0"

[dependencies]
byteorder = "1.3"
env_logger = {version = "0.6", default-features = false } # disable `regex` to reduce code size
lazy_static = "1"
log = "0.4"
pkcs11 = "0.5"
sha2 = "0.8"

[target."cfg(target_os = \"macos\")".dependencies.core-foundation]
version = "0.6"

[target."cfg(target_os = \"macos\")".dependencies.libloading]
version = "0.5"

[target."cfg(target_os = \"macos\")".dependencies.rental]
version = "0.5"

[target."cfg(target_os = \"windows\")".dependencies.winapi]
version = "0.3"
features = ["wincrypt", "bcrypt", "errhandlingapi", "ncrypt"]

[build-dependencies]
bindgen = "0.72"

[lib]
crate-type = ["cdylib"]
